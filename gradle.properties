# This file was generated by the Gradle 'init' task, then extended for Android.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=true

# Required so AGP resolves androidx.* artifacts (core-ktx, appcompat) instead
# of the old android.support.* libraries.
android.useAndroidX=true

# Room/KSP + Compose + lint need more than Gradle's default (512 MiB heap /
# 384 MiB metaspace); without this the daemon dies with "OutOfMemoryError: Metaspace".
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
