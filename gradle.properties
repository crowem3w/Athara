# This file was generated by the Gradle 'init' task, then extended for Android.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=true

# Required so AGP resolves androidx.* artifacts (core-ktx, appcompat) instead
# of the old android.support.* libraries.
android.useAndroidX=true

# Compose + lint need more than Gradle's default (512 MiB heap /
# 384 MiB metaspace); without this the daemon dies with "OutOfMemoryError: Metaspace".
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Backend gateway the app talks to (see backend/README.md). Debug defaults to the host machine as seen
# from the Android emulator; use your LAN IP (http://192.168.x.x:8080/api/v1) on a physical phone.
ahtara.apiBaseUrl=http://10.0.2.2:8080/api/v1
# Release builds must use HTTPS (put Caddy/Traefik/nginx in front of the gateway).
ahtara.apiBaseUrlRelease=https://api.example.invalid/api/v1
